name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # node:sqlite (pet hotel persistence) needs Node 22.13 or newer.
  NODE_VERSION: '22'

jobs:
  unit:
    name: Typecheck, unit tests and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace server-in-test
      - run: npm run typecheck --workspace playwright/e2e-framework
      - name: Server and UI tests with coverage floors
        run: npm run coverage --workspace server-in-test
      - name: Framework unit tests
        run: npm run test --workspace playwright/e2e-framework
      - name: Repeat the hotel UI tests to catch flakiness
        working-directory: server-in-test
        run: for i in 1 2 3; do npx vitest run tests/apps/hotel || exit 1; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server-in-test/coverage
          if-no-files-found: ignore

  e2e:
    name: Playwright (healing demo, pet hotel, mobile, accessibility)
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright/e2e-framework/playwright-report
          retention-days: 14

  robot:
    name: Robot Framework (unit, healer in Chrome, v1/v2/v3 e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: robot/requirements.txt
      - run: npm ci
      - run: pip install -r robot/requirements.txt
      # Selenium Manager downloads a matching chromedriver for the runner's Chrome.
      - name: Unit and healer integration tests
        working-directory: robot
        run: python -m pytest
      - name: e2e suites on UI v1, v2 and v3
        working-directory: robot
        run: python run_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: robot/results
          retention-days: 14

  visual:
    name: Visual regression (Linux baselines)
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      VISUAL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Compare with committed baselines, or create them on the first run
        working-directory: playwright/e2e-framework
        run: |
          if ls e2e/hotel/visual.spec.ts-snapshots/*-linux.png >/dev/null 2>&1; then
            npx playwright test --project=hotel-visual
          else
            echo "No Linux baselines yet: creating them. Download the 'visual-baselines' artifact and commit it."
            npx playwright test --project=hotel-visual --update-snapshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: |
            playwright/e2e-framework/e2e/hotel/visual.spec.ts-snapshots
            playwright/e2e-framework/test-results
          if-no-files-found: ignore
